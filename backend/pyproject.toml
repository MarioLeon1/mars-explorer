[project]
name = "mars-explorer"
version = "0.1.0"
description = "Mars Explorer backend: NASA Mars 2020 data ingestion, perception, terrain and navigation API"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.163",
    "httpx>=0.28",
    "pydantic>=2.14",
    "pydantic-settings>=2.6",
    "sqlmodel>=0.0.24",
    "uvicorn[standard]>=0.54",
]

[project.scripts]
mars-ingest = "mars_explorer.ingest.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mars_explorer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers -m 'not live'"
markers = [
  "live: hits real NASA endpoints over the network (opt-in: uv run pytest -m live)",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.14",
]
